<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>e-Consul Helper</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="head">
    <div class="logo" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFD500" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2v4M16 2v4"></path></svg>
    </div>
    <div class="title">e-Consul Helper</div>
    <span id="pill" class="pill muted">…</span>
</header>

<!-- The files on disk are newer than the loaded extension (unpacked: the background and the
     content scripts are read only when the extension is reloaded) -->
<div id="reloadNote" class="reload-note" hidden>
    Код розширення оновлено. Натисніть ⟳ на картці e-Consul Helper у <span class="mono">chrome://extensions</span>, щоб він запрацював.
</div>

<!-- Not logged in, or the session state is not known yet -->
<main id="loggedOut" class="alert-card" hidden>
    <div class="msg">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none" aria-hidden="true"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
        <div>
            <div id="outTitle" class="msg-title">Сесія на e-consul скінчилась</div>
            <div id="outText" class="sub">Моніторинг зупинено. Він запуститься сам, щойно ви увійдете.</div>
        </div>
    </div>
    <button id="loginBtn" class="primary" type="button"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 8l4 4-4 4M14 12H4"/></svg>Увійти на e-consul</button>
</main>

<!-- Logged in -->
<div id="loggedIn" hidden>
    <main class="body">
        <section class="sess">
            <div class="line"><span class="dot"></span><span id="tokenLeft" class="grow"></span><span id="tokenNote" class="ok-text"></span></div>
            <div id="tokenBar" class="bar"><div></div></div>
        </section>

        <section class="sect">
            <div class="sect-h"><b id="draftTitle">Чернетка заявки</b><span id="draftInfo" class="sub"></span><span id="draftNote" class="ok-text"></span></div>
            <div id="draftText" class="sub" hidden></div>
            <div class="btns">
                <button id="openDraftBtn" class="primary" type="button"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>Відкрити</button>
                <button id="newDraftBtn" class="secondary" type="button"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Створити нову</button>
            </div>
        </section>

        <div class="time-row">
            <label class="check-label" for="alarmEnabled">
                <input id="alarmEnabled" type="checkbox">
                <span class="l">Будильник за</span>
            </label>
            <span class="time-field"><input id="alarmLead" type="number" min="1" max="60" step="1" inputmode="numeric" aria-label="Хвилин до відкриття"> хв до відкриття</span>
            <button class="q" type="button" aria-label="Про будильник">?<span class="tip">За вказану кількість хвилин до відкриття нових днів поточної установи розширення нагадає звуком і нотифікацією: увійти на e-consul, якщо сесії немає, або запустити моніторинг, якщо він не працює. Якщо чернетки немає, вона недійсна чи не дійшла до застосунку, створює нову. Коли все гаразд, мовчить. Час відкриття бере із застосунку (потрібна відкрита вкладка).</span></button>
        </div>
        <div id="alarmNext" class="sub" hidden></div>

        <div class="mon">
            <div class="line"><span id="monitorDot" class="dot"></span><b id="monitorTitle" class="grow"></b><span id="monitorText" class="sub"></span></div>
        </div>

        <section id="slotsBlock" hidden>
            <div class="log-h">Нові слоти</div>
            <div id="slotLog" class="log"></div>
        </section>

        <div class="check">
            <label class="check-label" for="autoDraft">
                <input id="autoDraft" type="checkbox">
                <span class="l">Створювати чернетку після входу</span>
            </label>
            <button class="q" type="button" aria-label="Про автоматичну чернетку">?<span class="tip">Після входу на e-consul, якщо чернетки немає, вона прострочена чи сайт її видалив, розширення саме пройде кроки 1–3 з установою й послугою з налаштувань застосунку.</span></button>
        </div>
        <div class="check">
            <label class="check-label" for="autoMonitor">
                <input id="autoMonitor" type="checkbox">
                <span class="l">Запускати моніторинг після входу</span>
            </label>
            <button class="q" type="button" aria-label="Про автозапуск моніторингу">?<span class="tip">Коли ви входите на e-consul (токен приходить у застосунок), застосунок сам запускає моніторинг, якщо він не працює. Потрібна відкрита вкладка застосунку.</span></button>
        </div>
        <div class="check">
            <label class="check-label" for="autoBook">
                <input id="autoBook" type="checkbox">
                <span class="l">Бронювати автоматично</span>
            </label>
            <button class="q" type="button" aria-label="Про автоматичне бронювання">?<span class="tip">Розширення саме натисне «Підтвердити» після вибору слота: раз на слот, після відмови — наступний слот через 10 с; не більше 20 натискань на годину. Вимкнено: «Підтвердити» натискаєте ви.</span></button>
        </div>
        <div class="check">
            <label class="check-label" for="aggressiveBook">
                <input id="aggressiveBook" type="checkbox">
                <span class="l">Агресивне бронювання</span>
            </label>
            <button class="q" type="button" aria-label="Про агресивне бронювання">?<span class="tip">Без ліміту 20 натискань на годину, наступний слот — одразу, без паузи 10 с; слот, що не забронювався, пропускається 5 хв. Вимикається само, коли сесія закінчується. Потрібне «Бронювати автоматично».</span></button>
        </div>
        <div class="presses-row">
            <span class="sub" id="pressesText">Натискань за годину: 0 з 20</span>
            <button id="resetPressesBtn" class="secondary mini" type="button">Скинути ліміт</button>
        </div>
    </main>
    <footer class="foot">
        <button id="muteBtn" class="secondary" type="button"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4zM16 9l5 6M21 9l-5 6"/></svg>Вимкнути звук</button>
        <div class="with-q">
            <button id="pauseBtn" class="secondary" type="button"><svg class="i" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><span id="pauseLabel">Призупинити</span></button>
            <button class="q" type="button" aria-label="Про паузу">?<span class="tip">Пауза вимикає автовибір і бронювання слота в чернетці. Застосунок і далі шукає слоти та сповіщає.</span></button>
        </div>
    </footer>
</div>

<script src="popup.js"></script>
</body>
</html>
